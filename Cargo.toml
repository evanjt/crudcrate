[workspace]
members = ["crudcrate", "crudcrate-derive", "test_suite"]
exclude = ["docs/test-links"]
resolver = "2"

[workspace.dependencies]
# Procedural macro dependencies
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "derive", "parsing", "printing", "clone-impls", "proc-macro"] }
convert_case = "0.8.0"
# heck is kept alongside convert_case because its `to_pascal_case()` handles
# number boundaries differently (e.g. `user_2fa` → `User2fa` vs `User2Fa`).
# See crudcrate-derive/src/codegen/type_resolution.rs.
heck = { version = "0.5.0", default-features = false }

# Core dependencies
async-trait = "0.1.89"
axum = "0.8.9"
sea-orm = { version = "2.0.0", default-features = false }
serde = "1.0.228"
serde_json = "1.0.149"
serde_with = "3.20.0"
utoipa = "5.5.0"
uuid = "1.23.1"
chrono = "0.4.44"
rust_decimal = "1.42.0"

# Development dependencies
tokio = "1.52.3"
sea-orm-migration = "2.0.0"
tower = "0.5.2"
tower-http = "0.7.0"

percent-encoding = "2.3.2"
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
criterion = "0.7.0"
tracing = "0.1"
tracing-subscriber = "0.3"


# Patch crates.io crudcrate with the local version for development
[patch.crates-io]
crudcrate = { path = "crudcrate" }

[profile.dev]
# Faster compilation in development
debug = 1

[profile.test]
# Better performance for tests
opt-level = 1
