[package]
name = "test_suite"
version = "0.11.0"
edition = "2024"
description = "Test suite for crudcrate and crudcrate-derive"
license = "MIT"
publish = false

[dependencies]
# Use the local crudcrate with derive feature
crudcrate = { path = "../crudcrate", features = ["derive", "sqlite"] }

# Core dependencies
axum = { workspace = true, features = ["macros"] }
sea-orm = { workspace = true, features = ["sqlx-sqlite", "sqlx-postgres", "sqlx-mysql", "runtime-tokio-rustls", "macros", "with-uuid", "with-chrono", "with-rust_decimal"] }
sea-orm-migration = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
uuid = { workspace = true, features = ["serde", "v4"] }
chrono = { workspace = true, features = ["serde"] }
utoipa = { workspace = true, features = ["uuid", "chrono", "decimal", "axum_extras"] }
utoipa-axum = { workspace = true }
rust_decimal = { workspace = true }

# Additional dependencies needed by tests
tower-http = { workspace = true, features = ["cors", "trace"] }
percent-encoding = { workspace = true }
async-trait = { workspace = true }
serial_test = "3.2"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
too_many_lines = "allow"
